name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: images
        shell: bash
        run: |
          repository="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "client=${REGISTRY}/${repository}-client:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "server=${REGISTRY}/${repository}-server:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "client_latest=${REGISTRY}/${repository}-client:latest" >> "$GITHUB_OUTPUT"
          echo "server_latest=${REGISTRY}/${repository}-server:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/client/Dockerfile
          push: true
          build-args: |
            CLIENT_API_URL=${{ secrets.CLIENT_API_URL }}
            CLIENT_SOCKET_URL=${{ secrets.CLIENT_SOCKET_URL }}
          tags: |
            ${{ steps.images.outputs.client }}
            ${{ steps.images.outputs.client_latest }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.server }}
            ${{ steps.images.outputs.server_latest }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Copy compose file to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_SSH_PORT || 22 }}
          source: deploy/docker-compose.yml
          target: ${{ secrets.DO_APP_DIR }}
          strip_components: 1

      - name: Deploy on Droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          CLIENT_IMAGE: ${{ steps.images.outputs.client }}
          SERVER_IMAGE: ${{ steps.images.outputs.server }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_SSH_PORT || 22 }}
          envs: CLIENT_IMAGE,SERVER_IMAGE,GHCR_USERNAME,GHCR_TOKEN,REGISTRY
          script: |
            set -euo pipefail
            mkdir -p "${{ secrets.DO_APP_DIR }}"
            cd "${{ secrets.DO_APP_DIR }}"
            umask 077
            cat > .env <<'EOF'
            CLIENT_URL=${{ secrets.CLIENT_URL }}
            CLIENT_PORT=${{ secrets.CLIENT_PORT }}
            SERVER_PORT=${{ secrets.SERVER_PORT }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET }}
            REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}
            GOOGLE_CALENDAR_CLIENT_ID=${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
            GOOGLE_CALENDAR_CLIENT_SECRET=${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
            GOOGLE_CALENDAR_REDIRECT_URI=${{ secrets.GOOGLE_CALENDAR_REDIRECT_URI }}
            CALENDAR_TOKEN_SECRET=${{ secrets.CALENDAR_TOKEN_SECRET }}
            EOF
            echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin
            CLIENT_IMAGE="$CLIENT_IMAGE" SERVER_IMAGE="$SERVER_IMAGE" docker compose pull
            CLIENT_IMAGE="$CLIENT_IMAGE" SERVER_IMAGE="$SERVER_IMAGE" docker compose up -d postgres
            CLIENT_IMAGE="$CLIENT_IMAGE" SERVER_IMAGE="$SERVER_IMAGE" docker compose run --rm migrate
            CLIENT_IMAGE="$CLIENT_IMAGE" SERVER_IMAGE="$SERVER_IMAGE" docker compose up -d --remove-orphans
            docker image prune -f
