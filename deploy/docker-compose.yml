services:
  client:
    image: ${CLIENT_IMAGE}
    container_name: syncr-client
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - server

  server:
    image: ${SERVER_IMAGE}
    container_name: syncr-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      demo-postgres:
        condition: service_healthy

  migrate:
    image: ${SERVER_IMAGE}
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      demo-postgres:
        condition: service_healthy
    command: ["npm", "run", "db:migrate:all", "-w", "server"]
    profiles:
      - deploy

  postgres:
    image: postgres:17-alpine
    container_name: syncr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-syncr-db}
    volumes:
      - syncr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-syncr-db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  demo-postgres:
    image: postgres:17-alpine
    container_name: syncr-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DEMO_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DEMO_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DEMO_POSTGRES_DB:-syncr-demo-db}
    volumes:
      - syncr-demo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DEMO_POSTGRES_USER:-postgres} -d ${DEMO_POSTGRES_DB:-syncr-demo-db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  syncr-postgres-data:
  syncr-demo-postgres-data:
