services:
  postgres:
    image: postgres
    container_name: syncr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: EUdbmy1tdFj5oytL
      POSTGRES_DB: syncr-db
    ports:
      - "5432:5432"
    volumes:
      - syncr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d syncr-db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  syncr-postgres-data:

